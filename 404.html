<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到 | 日语小贴士</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #6b7c93;
            --accent: #d65a31;
            --jp-font: "Noto Sans SC", "Source Han Sans CN", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "Noto Sans SC", "Source Han Sans CN", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem 1rem;
        }

        .bg-text {
            position: fixed;
            font-size: 25vw;
            font-weight: 900;
            color: rgba(0,0,0,0.03);
            z-index: 0;
            user-select: none;
            line-height: 1;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 640px;
            width: 100%;
            text-align: center;
        }

        /* ========== 404 强提示区域 ========== */
        .error-header {
            margin-bottom: 1.5rem;
        }

        .error-code {
            font-size: 4rem;
            font-weight: 900;
            color: var(--accent);
            line-height: 1;
            letter-spacing: -2px;
        }

        .error-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 0.5rem;
            color: var(--text-main);
        }

        .error-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-top: 0.4rem;
        }

        /* ========== 随机图片 ========== */
        .random-image-wrapper {
            width: 100%;
            height: 200px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            background: #e8e4dd;
            position: relative;
        }

        .random-image-wrapper img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        .image-caption {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.5));
            color: #fff;
            padding: 2rem 1rem 0.6rem;
            font-size: 0.75rem;
            text-align: right;
        }

        /* ========== 知识卡片（含右上角按钮） ========== */
        .tip-card {
            background: var(--card-bg);
            padding: 2.5rem 2rem 2rem;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border-top: 4px solid var(--accent);
            transition: opacity 0.4s ease, transform 0.4s ease;
            text-align: left;
            position: relative; /* 为按钮绝对定位提供参照 */
        }

        .tip-card.fade-out {
            opacity: 0;
            transform: translateY(-8px);
        }

        /* 换一换按钮 - 卡片右上角 */
        .refresh-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: 1px solid var(--text-sub);
            color: var(--text-sub);
            padding: 0.35rem 0.9rem;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            z-index: 2;
        }

        .refresh-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .refresh-btn svg {
            width: 12px; height: 12px;
            transition: transform 0.5s ease;
        }
        .refresh-btn:hover svg { transform: rotate(180deg); }

        .jp-word {
            font-family: var(--jp-font);
            font-size: 2.2rem;
            color: var(--text-main);
            text-align: center;
            margin-top: 0.5rem;
        }

        .jp-reading {
            font-size: 0.9rem;
            color: var(--text-sub);
            text-align: center;
            margin-bottom: 1.2rem;
            font-style: italic;
        }

        .cn-meaning {
            font-size: 1.15rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1.2rem;
            padding-bottom: 1rem;
            border-bottom: 1px dashed #eee;
        }

        /* ========== 富文本内容 ========== */
        .tip-body { font-size: 0.92rem; line-height: 1.9; color: var(--text-main); }
        .tip-body p { margin-bottom: 0.7rem; }
        .tip-body p:last-child { margin-bottom: 0; }
        .tip-body strong { color: var(--accent); font-weight: 700; }
        .tip-body .dim { color: #bbb; }

        .example-block {
            background: #faf9f6;
            border-left: 3px solid var(--accent);
            padding: 0.7rem 1rem;
            margin: 0.7rem 0;
            border-radius: 0 4px 4px 0;
        }
        .example-jp { font-family: var(--jp-font); font-size: 0.95rem; margin-bottom: 0.2rem; }
        .example-cn { font-size: 0.82rem; color: var(--text-sub); }

        .culture-tag {
            display: inline-block;
            font-size: 0.7rem;
            background: var(--accent);
            color: #fff;
            padding: 2px 7px;
            border-radius: 3px;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        /* ========== 底部链接 ========== */
        .back-link {
            margin-top: 1.5rem;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.85rem;
            opacity: 0.7;
            transition: opacity 0.3s;
            display: inline-block;
        }
        .back-link:hover { opacity: 1; text-decoration: underline; }

        @media (max-width: 480px) {
            .error-code { font-size: 3rem; }
            .jp-word { font-size: 1.7rem; }
            .tip-card { padding: 2rem 1.2rem 1.5rem; }
            .random-image-wrapper { height: 150px; }
            .refresh-btn { top: 0.7rem; right: 0.7rem; padding: 0.3rem 0.7rem; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

<div class="bg-text">404</div>

<div class="container">
    <!-- ✅ 强化的404提示 -->
    <div class="error-header">
        <div class="error-code">404</div>
        <div class="error-title">抱歉，您访问的页面不存在</div>
        <div class="error-desc">该页面可能已被移除或链接有误 · 不如趁此学一句日语吧 ✨</div>
        <div class="error-desc">本页信息尚未经过严格校对，仅供参考！</div>
    </div>

    <!-- 🖼️ 随机图片（页面加载时选定，换一换不变） -->
    <div class="random-image-wrapper">
        <img id="randomImg" src="" alt="日语氛围图">
        <div class="image-caption" id="imgCaption"></div>
    </div>

    <!-- 📖 知识卡片 -->
    <div class="tip-card" id="tipCard">
        <!-- ✅ 换一换按钮移至卡片右上角 -->
        <button class="refresh-btn" id="refreshBtn" title="换一条小知识">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
            换一换
        </button>

        <div class="jp-word" id="jpWord">...</div>
        <div class="jp-reading" id="jpReading">...</div>
        <div class="cn-meaning" id="cnMeaning">...</div>
        <div class="tip-body" id="tipBody">...</div>
    </div>

    <a href="/" class="back-link">← 返回首页</a>
</div>

<script>
/* =============================================================
   📚 日语知识库

   ⚠️ 安全标记语法（完全避免引号/转义报错）：
     【加粗文字】       → 红色加粗
     《置灰文字》       → 浅灰色弱化（隐藏主语等）
     >>日文例句|中文翻译 → 例句卡片块
     [文化]             → 红色「文化知识」标签
     空行               → 段落分隔
   ============================================================= */

var tips = [
    {
        word: "木漏れ日",
        reading: "Komorebi（こもれび）",
        meaning: "阳光透过树叶缝隙洒下的光影",
        content: "[文化]这是日语中【最美且无法直译】的词汇之一。\n\n它描述的是一种特定的自然现象——阳光穿过树叶间隙，在地面上形成斑驳摇曳的光影。\n\n>>木漏れ日が差し込む森を散歩する。|在阳光透过树叶洒落的森林中散步。\n\n日本人认为这种光影变化体现了《物哀（もののあはれ）》的美学意识，即对【转瞬即逝之美】的深切感动。"
    },
    {
        word: "一期一会",
        reading: "Ichigo Ichie（いちごいちえ）",
        meaning: "一生仅有一次的相会",
        content: "[文化]源自【茶道】的核心精神用语。\n\n提醒人们珍惜当下的每一次相遇，因为此时此刻的时光永远不会重来。即使与同一个人再次相见，彼此的心境与环境也已完全不同。\n\n>>この出会いは一期一会だと思って、大切にしたい。|我想把这次相遇当作一生一次的缘分来珍惜。\n\n《私》は今、あなたとこうして話せていることが、まさに一期一会ですね。"
    },
    {
        word: "積ん読",
        reading: "Tsundoku（つんどく）",
        meaning: "买了书却堆着不读",
        content: "由【積む】（堆积）和【読書】（读书）组合而成的造语。\n\n精准描述了全世界爱书人的共同通病。有趣的是，这个词并不含贬义，反而带着一种对书籍热爱之情的温暖自嘲。\n\n>>また本を買ってしまった。完全に積ん読になりそうだ。|又买了书，感觉完全要变成堆着不读了。\n\n与之相对的概念是【読みかけ】（读到一半搁置），两者经常一起出现在日本读书爱好者的日常对话中。"
    },
    {
        word: "金継ぎ",
        reading: "Kintsugi（きんつぎ）",
        meaning: "用金粉修补破碎器物的传统工艺",
        content: "[文化]与其掩盖裂痕，不如用【金漆】将其凸显为美。\n\n这种哲学认为破损和修复是物体历史的一部分，而非需要隐藏的缺陷。伤痕也可以成为最美的地方。\n\n>>割れた茶碗を金継ぎで修復した。|用金缮工艺修复了破碎的茶碗。\n\n这个概念近年来在全球心理学领域也被广泛引用，用来比喻《人》在经历创伤后的成长与重生。"
    },
    {
        word: "生きがい",
        reading: "Ikigai（いきがい）",

    },
    {
        word: "猫舌",
        reading: "Nekojita（ねこじた）",
        meaning: "怕烫的舌头（像猫一样）",
        content: "非常可爱的日常用语 🐱\n\n日本人观察到猫不喜欢热食，便用来形容【不能吃烫的人】。类似的动物相关表达还有：\n\n>>私は猫舌なので、ラーメンはいつも冷ましてから食べます。|我怕烫，所以吃拉面总是等凉了再吃。\n\n【猫の手も借りたい】：忙得连猫的手都想借\n【猫かぶり】：装乖、假装老实\n【猫ばば】：捡到东西据为己有"
    },
    {
        word: "七転び八起き",
        reading: "Nana Korobi Ya Oki（ななころびやおき）",
        meaning: "七次跌倒，八次站起",
        content: "[文化]日本最著名的谚语之一，象征【不屈不挠】的精神。\n\n注意是八次站起而不是七次——多出来的那一次代表着：无论失败多少次，永远要多站起来一次。\n\n>>七転び八起きの精神で、何度でも挑戦する。|以百折不挠的精神，无论多少次都要继续挑战。\n\n《私たち》はこの失敗から学び、また立ち上がる。"
    },
    {
        word: "幽玄",
        reading: "Yūgen（ゆうげん）",
        meaning: "深邃幽远、不可言喻之美",
        content: "[文化]能剧大师世阿弥提出的美学概念。\n\n指那种无法用语言完全表达的、含蓄而深远的美。如同薄雾笼罩的山峦，【留白比直白更有力量】。\n\n>>この絵には幽玄の美しさがある。|这幅画有一种深邃幽远的美。\n\n与侘寂（接受不完美）、物哀（感叹无常）并列为日本三大美学理念，三者共同构成了日本人对世界的独特感知方式。"
    },
    {
        word:"动词四分类 ①",
        reading:"金田一春彦分类法",
        meaning:"第一类：状态动词",
        content: `[语法]金田一春彦将日语动词按【语义特征】分为四大类。\n\n第一类是【状态动词】，表示持续存在的状态，而非动作。\n\n特点：\n· 一般【不使用ている】形式（因为本身就表示状态）\n· 没有命令形（无法命令一个状态发生）\n\n常见词：【ある】（有）、【いる】（在）、【できる】（能够）、【わかる】（明白）、【似る】（像）\n\n>>ここに私の傘がある。|这里有一把我的伞。\n>>あの人は日本語がわかる。|那个人懂日语。`
    },
    {
        word:"动词四分类 ②",
        reading:"金田一春彦分类法",
        meaning:"第二类：持续动词",
        content: `[语法]第二类是【持续动词】，表示需要时间持续进行的动作。\n\n特点：\n· ている表示【正在进行】\n· 可以使用命令形\n\n常见词：【食べる】（吃）、【読む】（读）、【走る】（跑）、【書く】（写）、【話す】（说）\n\n>>今、ご飯を食べている。|现在正在吃饭。\n>>本を読んでいます。|正在读书。\n\n与瞬间动词的关键区别：持续动词的ている强调【动作正在进行中】。`
    },
    {
        word:"动词四分类 ③",
        reading:"金田一春彦分类法",
        meaning:"第三类：瞬间动词",
        content: `[语法]第三类是【瞬间动词】，表示瞬间完成的动作或变化。\n\n特点：\n· ている表示【变化后的结果状态】，而非正在进行\n· 原形通常表示将来\n\n常见词：【死ぬ】（死）、【着く】（到达）、【始まる】（开始）、【止まる】（停止）、【結婚する】（结婚）\n\n>>電車が行った。|电车走了。（瞬间完成）\n>>電車がもう着いている。|电车已经到了。（结果状态）\n\n>>父はもう死んでいる。|父亲已经去世了。（结果状态，不是"正在死"）`
    },
    {
        word:"动词四分类 ④",
        reading:"金田一春彦分类法",
        meaning:"第四类：第四种动词",
        content: `[语法]第四类动词语义类似形容词，通常以ている的形式出现。\n\n特点：\n· ている表示【状态】\n· 原形较少单独使用\n\n常见词：【優れる】、【尖る】、【聳える】（持续）\n\n>>彼は優れている。|他很优秀。\n>>山が聳えている。|山峰耸立。\n\n这类词描述的是状态，ている形式是最自然的使用方式。`
    },
    {
        word:"意志动词 vs 非意志动词",
        reading:"Yuishi Dōshi vs Hi-Ishi Dōshi",
        meaning:"能否由人的意志控制",
        content: `[语法]这是日语语法中一组非常重要的分类。\n\n【意志动词】：可以由人的意志自由控制的动作。\n如：食べる、走る、書く、考える\n\n【非意志动词】：不由人的意志控制，自然发生或描述状态。\n如：雨が降る、花が咲く、できる、わかる\n\n>>私は毎日走る。|我每天跑步。（意志动词，可以自主决定）\n>>雨が降る。|下雨。（非意志动词，人无法控制）\n\n这个区分对理解【命令形】、【たい】、【可能形】等语法至关重要。`
    },
    {
        word:"无标可能",
        reading:"非意志动词没有可能形式",
        meaning:"非意志动词本身就是可能的",
        content: `[语法]日语中有一个容易被忽略的规则：\n\n【非意志动词】本身就含有"可能"的语义，因此【不需要也不能】变成可能形。\n\n例如：\n· 届く→ 《×》届ける\n· 開く→ 《×》開ける\n· 見える→ 《×》見えられる\n\n>>日本語がわかる。|我懂日语。（已经表达了"能懂"）\n>>山が見える。|看得见山。（已经表达了"能看到"）\n\n只有【意志动词】才需要变成可能形来表达"能够做某事"。`
    },
    {
        word:"たい的不可能三角",
        reading:"三个条件不能同时满足",
        meaning:"主语为二/三人称 · 句末 · 陈述句",
        content: `[语法]日语中【たい】的使用有一个著名的"不可能三角"规则。\n\n以下三个条件【不能同时满足】：\n· 主语是【第二或第三人称】\n· たい位于【句子末尾】\n· 句子是【陈述句】\n\n如果主语是"我"，三个条件可以满足：\n>>私は寿司が食べたい。|我想吃寿司。《〇》\n\n如果主语是别人，则必须打破至少一个条件：\n>>彼は寿司が食べたいそうだ。|听说他想吃寿司。（加了そうだ，不在句末）\n>>彼は寿司が食べたがっている。|他表现出想吃的样子。（变成たがる）`
    },
    {
        word:"使役动词的自他性",
        reading:"Shieki Dōshi no Ji-Ta-Sei",
        meaning:"使役形式改变动词的自他属性",
        content: `[语法]使役动词的自他性是一个容易出错的知识点。\n\n核心原则：【自动词的使役形】在句法功能上相当于【他动词】，需要宾语を。\n\n>>子供を走らせる。|让孩子跑。（自动词走る → 使役走らせる，用を）\n\n注意区分：\n· 【発展させる】（发展，使役）→ 経済を発展させる\n· 【形成する】（形成，他动词）→ 習慣を形成する\n\n>>経済を発展させる。|发展经济。\n>>いい習慣を形成する。|养成好习惯。\n\n使役形式让原本不能带宾语的自动词获得了【带宾语的能力】。`
    },
    {
        word:"无标被动",

    }
];

var images = [
    { url: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=800&q=80", caption: "京都 · 竹林小径" },

// ==================== DOM ====================
var els = {
    card: document.getElementById("tipCard"),
    word: document.getElementById("jpWord"),
    reading: document.getElementById("jpReading"),
    meaning: document.getElementById("cnMeaning"),
    body: document.getElementById("tipBody"),
    btn: document.getElementById("refreshBtn"),
    img: document.getElementById("randomImg"),
    imgCaption: document.getElementById("imgCaption")
};

var lastTipIndex = -1;

// ==================== 安全解析引擎（无正则转义风险） ====================
function parseContent(raw) {
    // 先按双换行分段
    var paragraphs = raw.split("\n\n");
    var result = "";

    for (var i = 0; i < paragraphs.length; i++) {
        var p = paragraphs[i];

        // 文化标签
        p = p.replace(/\[文化\]/g, '<span class="culture-tag">文化知识</span> ');
        p = p.replace(/\[语法\]/g, '<span class="culture-tag">语法知识</span> ');

        // 例句块 >>日文|中文
        p = p.replace(/>>(.+?)\|(.+)/g, function(m, jp, cn) {
            return '<div class="example-block"><div class="example-jp">' + jp + '</div><div class="example-cn">' + cn + '</div></div>';
        });

        // 加粗 【】
        p = p.replace(/【(.+?)】/g, "<strong>$1</strong>");

        // 置灰 《》
        p = p.replace(/《(.+?)》/g, '<span class="dim">$1</span>');

        // 段内单换行
        p = p.replace(/\n/g, "<br>");

        result += "<p>" + p + "</p>";
    }

    return result;
}

// ==================== 随机（避免连续重复） ====================
function getRandom(arr, last) {
    if (arr.length <= 1) return 0;
    var idx;
    do { idx = Math.floor(Math.random() * arr.length); } while (idx === last);
    return idx;
}

// ==================== 渲染 ====================
function renderTip(tip) {
    els.word.textContent = tip.word;
    els.reading.textContent = tip.reading;
    els.meaning.textContent = tip.meaning;
    els.body.innerHTML = parseContent(tip.content);
}

function renderImage(img) {
    els.img.src = img.url;
    els.img.alt = img.caption;
    els.imgCaption.textContent = img.caption;
}

// ==================== 切换（仅知识点，图片不变） ====================
function switchTip() {
    els.card.classList.add("fade-out");
    setTimeout(function() {
        lastTipIndex = getRandom(tips, lastTipIndex);
        renderTip(tips[lastTipIndex]);
        els.card.classList.remove("fade-out");
    }, 400);
}

// ==================== 初始化 ====================
window.addEventListener("DOMContentLoaded", function() {
    renderImage(images[getRandom(images, -1)]);
    lastTipIndex = getRandom(tips, -1);
    renderTip(tips[lastTipIndex]);
});

els.btn.addEventListener("click", switchTip);

document.addEventListener("keydown", function(e) {
    if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        switchTip();
    }
});
</script>
</body>
</html>
