<!DOCTYPE html>
<html lang="zh-CN">
<head>
        <meta charset='utf-8'>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>日语动词逆变形</title>
        <!-- 图标保留 -->
        <link rel='icon' type='image/x-icon' href='icon/7.ico'/>
        <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #333;
        }
        .container {
            max-width: 900px; margin: 0 auto; background: white;
            border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 30px; text-align: center;
        }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .content { padding: 40px; }
        .input-label { display: block; font-size: 18px; font-weight: 600; margin-bottom: 15px; color: #555; }
        #verb {
            width: 100%; font-size: 28px; padding: 18px 20px;
            border: 2px solid #e0e0e0; border-radius: 12px; outline: none;
            transition: all 0.3s; font-family: inherit; text-align: center;
        }
        #verb:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .result-section {
            background: #f8f9fa; border-radius: 12px; padding: 25px;
            min-height: 200px; white-space: pre-line; font-size: 24px;
            line-height: 1.8; word-break: break-all; word-wrap: break-word;
            color: #2c3e50;
        }
        .result-section:empty::before { content: "逆变形结果将显示在这里..."; color: #999; font-size: 18px; }

        /* 全屏加载遮罩 */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.3s;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-title { font-size: 22px; font-weight: 600; margin-bottom: 20px; color: #333; }
        .progress-bar { width: 300px; max-width: 80%; height: 10px; background: #e0e0e0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 0%; transition: width 0.2s; }
        .progress-text { margin-top: 12px; font-size: 14px; color: #666; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .header { padding: 20px; }
            .header h1 { font-size: 24px; }
            .content { padding: 20px; }
            #verb { font-size: 22px; padding: 15px; }
            .result-section { font-size: 20px; padding: 20px; }
        }
    </style>
</head>
<body>

<!-- 全屏加载遮罩 -->
<div class="loading-overlay" id="loadingOverlay">
        <div class="loading-title" id="loadingTitle">正在初始化...</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">准备中...</div>
</div>

<div class="container">
        <div class="header">
                <h1>日语动词逆变形器</h1>
                <p>输入变形后的动词，还原为基本形</p>
        </div>
        <div class="content">
                <div style="margin-bottom:30px;">
                        <label class="input-label" for="verb">输入动词（变形后）</label>
                        <input type='text' id='verb' value='食べます' placeholder="例如：食べた、行きます" onkeyup="if(event.keyCode==13){work(this);}">
                </div>
                <div class="result-section" id='result'></div>
        </div>
</div>

<!-- 依赖库 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type='text/javascript' src='js/trans.js'></script>
<script type='text/javascript' src='js/detrans.js'></script>
<script type='text/javascript' src='js/romaji.js'></script>

<script>
    // ========== 全局状态 ==========
    var dict = [];
    let dictReady = false;

    const DB_NAME = 'VerbConjugatorDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'dictionary';
    let db = null;

    // ========== IndexedDB 操作 ==========
    function initDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onerror = () => reject(req.error);
            req.onsuccess = () => { db = req.result; resolve(db); };
            req.onupgradeneeded = (e) => {
                const d = e.target.result;
                if (!d.objectStoreNames.contains(STORE_NAME)) d.createObjectStore(STORE_NAME, { keyPath: 'id' });
            };
        });
    }

    async function loadDictFromDB() {
        try {
            await initDB();
            return new Promise((resolve) => {
                const tx = db.transaction([STORE_NAME], 'readonly');
                const req = tx.objectStore(STORE_NAME).get('dict');
                req.onsuccess = () => resolve(req.result ? req.result.data : null);
                req.onerror = () => resolve(null);
            });
        } catch { return null; }
    }

    async function saveDictToDB(data) {
        try {
            await initDB();
            return new Promise((resolve) => {
                const tx = db.transaction([STORE_NAME], 'readwrite');
                tx.objectStore(STORE_NAME).put({ id: 'dict', data, timestamp: Date.now() });
                tx.oncomplete = () => resolve(true);
                tx.onerror = () => resolve(false);
            });
        } catch { return false; }
    }

    async function clearDictFromDB() {
        try {
            await initDB();
            return new Promise((resolve) => {
                const tx = db.transaction([STORE_NAME], 'readwrite');
                tx.objectStore(STORE_NAME).delete('dict');
                tx.oncomplete = () => resolve(true);
                tx.onerror = () => resolve(false);
            });
        } catch { return false; }
    }

    // ========== UI 进度控制 ==========
    function showProgress(title, text, percent) {
        const overlay = document.getElementById('loadingOverlay');
        overlay.classList.remove('hidden');
        if (title) document.getElementById('loadingTitle').textContent = title;
        if (text !== undefined) document.getElementById('progressText').textContent = text;
        if (percent !== undefined) document.getElementById('progressFill').style.width = Math.min(100, Math.max(0, percent)) + '%';
    }

    function hideProgress() {
        document.getElementById('loadingOverlay').classList.add('hidden');
    }

    function formatBytes(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    // ========== 核心：执行字典脚本并等待就绪 ==========
    function executeDictScript(text) {
        return new Promise((resolve, reject) => {
            const prevLen = window.dict ? window.dict.length : 0;
            const script = document.createElement('script');
            script.textContent = text;
            document.head.appendChild(script);

            let attempts = 0;
            const maxAttempts = 300; // 最多等待30秒
            const timer = setInterval(() => {
                attempts++;
                // 检查 dict 变量是否已更新且有效
                if (window.dict && window.dict.length > prevLen && window.dict.length > 0) {
                    clearInterval(timer);
                    resolve(window.dict);
                } else if (attempts >= maxAttempts) {
                    clearInterval(timer);
                    reject(new Error('字典脚本执行超时'));
                }
            }, 100);
        });
    }

    // ========== 真实进度下载 ==========
    async function downloadAndInstallDict() {
        showProgress('📥 正在下载字典', '连接服务器...', 0);

        try {
            // 【关键修复】禁止服务器压缩，确保 Content-Length 与实际读取字节数一致
            const response = await fetch('./js/dict.js', {
                headers: { 'Accept-Encoding': 'identity' }
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const contentLength = response.headers.get('Content-Length');
            const total = contentLength ? parseInt(contentLength, 10) : 0;

            if (!response.body || !total) {
                showProgress('📥 正在下载字典', '大小未知，请稍候...', 50);
                const rawText = await response.text();
                await processDictText(rawText);
                return;
            }

            const reader = response.body.getReader();
            let received = 0;
            const chunks = [];

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                chunks.push(value);
                received += value.length;

                // 【安全保护】防止服务器忽略 identity 头导致百分比超过 100%
                const pct = Math.min(100, Math.round((received / total) * 100));
                const sizeText = `${formatBytes(received)} / ${formatBytes(total)} (${pct}%)`;
                showProgress('📥 正在下载字典', sizeText, pct);
            }

            const decoder = new TextDecoder('utf-8');
            const rawText = chunks.map(c => decoder.decode(c, { stream: true })).join('') + decoder.decode();
            await processDictText(rawText);

        } catch (err) {
            console.error('字典下载失败:', err);
            showProgress('❌ 加载失败', err.message, 0);
            setTimeout(() => {
                hideProgress();
                if (confirm(`字典加载失败：${err.message}\n\n是否重试？`)) {
                    clearDictFromDB().then(() => downloadAndInstallDict());
                }
            }, 1500);
        }
}

    async function processDictText(rawText) {
        try {
            showProgress('📦 正在解压字典', '解析数据中...', 90);
            const dictData = await executeDictScript(rawText);

            showProgress('💾 正在保存缓存', '即将完成...', 95);
            await saveDictToDB(dictData);
            dict = dictData;
            dictReady = true;

            showProgress('✅ 字典就绪', `共 ${dict.length} 个词条`, 100);
            setTimeout(hideProgress, 800);
        } catch (err) {
            throw err;
        }
    }

    // ========== 逆变形业务逻辑（保持原有算法） ==========
    function dict_match(d, r) {
        var type_d = d.type;
        var type_r = r[1];
        if (type_d.slice(0,2) == 'vs' && type_r.slice(0,2) == 'vs') return true;
        if (type_d.slice(0,2) != type_r.slice(0,2)) return false;
        if (type_d[1] == '2' || type_d[1] == '4') return false;
        if (type_d.length < 4 && type_r.length < 4 && type_d.slice(0,2) == type_r.slice(0,2)) return true;
        if (type_d.length > 3 && type_r.length < 4 && type_d.slice(0,2) == type_r.slice(0,2)) {
            if (type_d == 'v5aru' && r[2].length > 0 && r[2][0].slice(0,1) == 'ま') {
                if (to_masu(d.kaki,'v5aru') == r[3][0] || to_masu(d.yomi,'v5aru') == r[3][0]) return true;
                return false;
            }
            if (type_d == 'v5k-s' && r[2].length > 0 && (r[2][0].slice(0,1) == 'て' || r[2][0].slice(0,1) == 'た')) {
                if (to_te(d.kaki,'v5k-s') == r[3][0] || to_te(d.yomi,'v5k-s') == r[3][0] || to_ta(d.kaki,'v5k-s') == r[3][0] || to_ta(d.yomi,'v5k-s') == r[3][0]) return true;
                return false;
            }
            if (type_d == 'v5u-s' && r[2].length > 0 && (r[2][0].slice(0,1) == 'て' || r[2][0].slice(0,1) == 'た')) {
                if (to_te(d.kaki,'v5u-s') == r[3][0] || to_te(d.yomi,'v5u-s') == r[3][0] || to_ta(d.kaki,'v5k-s') == r[3][0] || to_ta(d.yomi,'v5k-s') == r[3][0]) return true;
                return false;
            }
            if (type_d == 'v5r-i' && r[2].length > 0 && r[2][0].slice(0,1) == 'な') {
                if (to_nai(d.kaki,'v5r-i') == r[3][0] || to_nai(d.yomi,'v5r-i') == r[3][0]) return true;
                return false;
            }
            if (type_d == 'v1-s' && r[2].length > 0 && r[2][0].slice(0,1) == '命') {
                if (to_command(d.kaki,'v1-s') == r[3][0] || to_command(d.yomi,'v1-s') == r[3][0]) return true;
                return false;
            }
        }
        if (type_d.length > 3 && type_r.length > 3 && type_d == type_r) return true;
        if (type_d.length < 4 && type_r.length > 3) return false;
        return true;
    }

    function look_up_dict(result) {
        var ans = [];
        for (var i = 0; i < dict.length; i++) {
            for (var j = 0; j < result.length; j++) {
                if (!dict_match(dict[i], result[j])) continue;
                kanji = result[j][0];
                if (dict[i].type.slice(0,2) != 'vs' || result[j][0].slice(-2, result[j][0].length) == 'する') {
                    if (kata_to_hira(dict[i].kaki) == kanji) {
                        ans.push([result[j][0], dict[i].type, result[j][2], result[j][3]]);
                        ans[ans.length-1][0] = dict[i].kaki + '(' + dict[i].yomi + ')';
                    } else if (kata_to_hira(dict[i].yomi) == kanji) {
                        ans.push([result[j][0], dict[i].type, result[j][2], result[j][3]]);
                        ans[ans.length-1][0] = dict[i].kaki + '(' + kanji + ')';
                    }
                }
                if (dict[i].type.slice(0,2) == 'vs') {
                    if (dict[i].kaki != '' && kata_to_hira(dict[i].kaki) + 'する' == kanji) {
                        ans.push([result[j][0], dict[i].type, result[j][2], result[j][3]]);
                        ans[ans.length-1][0] = dict[i].kaki + 'する(' + dict[i].yomi + 'する)';
                    } else if (kata_to_hira(dict[i].yomi) + 'する' == kanji) {
                        ans.push([result[j][0], dict[i].type, result[j][2], result[j][3]]);
                        if (dict[i].kaki != '') ans[ans.length-1][0] = dict[i].kaki + 'する(' + dict[i].yomi + 'する)';
                        else ans[ans.length-1][0] = dict[i].yomi + 'する';
                    }
                }
            }
        }
        return ans;
    }

    async function work(x) {
        if (!dictReady) {
            document.getElementById('result').textContent = '⏳ 字典加载中，请稍候...';
            return;
        }
        var verb = document.getElementById('verb').value;
        verb = verb.replace(/\s*/g, '');
        verb = romaji_to_hiragana(verb);
        verb = kata_to_hira(verb);
        if (verb == '') { document.getElementById('result').textContent = ''; return; }

        var result = process(verb);
        result = look_up_dict(result);
        result = get_result(result);

        if (result == '') result = '对不起，未能计算出"' + verb + '"的逆变形结果！';
        document.getElementById('result').textContent = result;
        document.getElementById('verb').focus();
        document.getElementById('verb').setSelectionRange(0, document.getElementById('verb').value.length);
    }

    // ========== 页面初始化 ==========
    window.addEventListener('load', async () => {
        showProgress('📖 正在加载字典', '读取本地缓存...', 30);
        const cached = await loadDictFromDB();

        if (cached && cached.length > 0) {
            dict = cached;
            dictReady = true;
            showProgress('✅ 字典就绪', `共 ${dict.length} 个词条（本地缓存）`, 100);
            setTimeout(hideProgress, 600);
        } else {
            await downloadAndInstallDict();
        }

        document.getElementById('verb').focus();
        document.getElementById('verb').setSelectionRange(0, document.getElementById('verb').value.length);
    });
</script>
</body>
</html>
