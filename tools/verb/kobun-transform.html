<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古典日语动词变形</title>
    <link rel='icon' type='image/x-icon' href='icon/6.ico'/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #d4a574 0%, #8b6914 100%);
            min-height: 100vh; padding: 20px; color: #3d3d3d;
        }
        .container {
            max-width: 900px; margin: 0 auto; background: white;
            border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #d4a574 0%, #8b6914 100%);
            color: white; padding: 30px; text-align: center;
        }
        .header h1 { font-size: 32px; margin-bottom: 10px; letter-spacing: 2px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .content { padding: 40px; }
        .input-label { display: block; font-size: 18px; font-weight: 600; margin-bottom: 15px; color: #555; }
        .input-row {
            display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
        }
        #verb {
            flex: 1; min-width: 200px; font-size: 28px; padding: 18px 20px;
            border: 2px solid #e0e0e0; border-radius: 12px; outline: none;
            transition: all 0.3s; font-family: inherit; text-align: center;
            background: #fffdf9;
        }
        #verb:focus { border-color: #d4a574; box-shadow: 0 0 0 3px rgba(212,165,116,0.2); }
        .btn-convert {
            font-size: 20px; padding: 18px 32px; background: #8b7355;
            color: white; border: none; border-radius: 12px; cursor: pointer;
            transition: background 0.3s, transform 0.15s; font-weight: 600;
            white-space: nowrap;
        }
        .btn-convert:hover { background: #6d5a43; }
        .btn-convert:active { transform: scale(0.97); }
        .result-section {
            background: #fdfbf7; border-radius: 12px; padding: 25px;
            min-height: 200px; white-space: pre-line; font-size: 28px;
            line-height: 1.8; word-break: break-all; word-wrap: break-word;
            color: #3d3d3d; text-align: left; border: 1px solid #ede6da;
        }
        .result-section:empty::before { content: "变形结果将显示在这里..."; color: #bbb; font-size: 18px; }

        /* 全屏加载遮罩 */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.3s;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-title { font-size: 22px; font-weight: 600; margin-bottom: 20px; color: #333; }
        .progress-bar { width: 300px; max-width: 80%; height: 10px; background: #e0e0e0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #d4a574, #8b6914); width: 0%; transition: width 0.2s; }
        .progress-text { margin-top: 12px; font-size: 14px; color: #666; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .header { padding: 20px; }
            .header h1 { font-size: 24px; }
            .content { padding: 20px; }
            #verb { font-size: 22px; padding: 15px; }
            .btn-convert { width: 100%; font-size: 18px; padding: 15px; }
            .result-section { font-size: 22px; padding: 20px; }
        }
    </style>
</head>
<body>

<!-- 全屏加载遮罩 -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-title" id="loadingTitle">正在初始化...</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">准备中...</div>
</div>

<div class="container">
    <div class="header">
        <h1>古典日语动词变形器</h1>
        <p>输入古典动词终止形，查看所有变形形式</p>
    </div>
    <div class="content">
        <div style="margin-bottom:30px;">
            <label class="input-label" for="verb">输入动词（终止形）</label>
            <div class="input-row">
                <input type='text' id='verb' value='食ぶ' placeholder="例如：食ぶ、書く、す" onkeyup="if(event.keyCode==13){work(this);}">
                <button class="btn-convert" type="button" onclick="work(this)">开始转换</button>
            </div>
        </div>
        <hr style="border:none;height:1px;background:linear-gradient(to right,transparent,#d4c5b0,transparent);margin:30px 0;">
        <div class="result-section" id='result'></div>
    </div>
</div>

<!-- 依赖库 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type='text/javascript' src='js/kobun_trans.js'></script>
<script type='text/javascript' src='js/romaji.js'></script>

<script>
    // ========== 全局状态 ==========
    var dict = [];
    let dictReady = false;

    const DB_NAME = 'KobunVerbDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'dictionary';
    let db = null;

    // ========== IndexedDB 操作 ==========
    function initDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onerror = () => reject(req.error);
            req.onsuccess = () => { db = req.result; resolve(db); };
            req.onupgradeneeded = (e) => {
                const d = e.target.result;
                if (!d.objectStoreNames.contains(STORE_NAME)) d.createObjectStore(STORE_NAME, { keyPath: 'id' });
            };
        });
    }

    async function loadDictFromDB() {
        try {
            await initDB();
            return new Promise((resolve) => {
                const tx = db.transaction([STORE_NAME], 'readonly');
                const req = tx.objectStore(STORE_NAME).get('dict');
                req.onsuccess = () => resolve(req.result ? req.result.data : null);
                req.onerror = () => resolve(null);
            });
        } catch { return null; }
    }

    async function saveDictToDB(data) {
        try {
            await initDB();
            return new Promise((resolve) => {
                const tx = db.transaction([STORE_NAME], 'readwrite');
                tx.objectStore(STORE_NAME).put({ id: 'dict', data, timestamp: Date.now() });
                tx.oncomplete = () => resolve(true);
                tx.onerror = () => resolve(false);
            });
        } catch { return false; }
    }

    async function clearDictFromDB() {
        try {
            await initDB();
            return new Promise((resolve) => {
                const tx = db.transaction([STORE_NAME], 'readwrite');
                tx.objectStore(STORE_NAME).delete('dict');
                tx.oncomplete = () => resolve(true);
                tx.onerror = () => resolve(false);
            });
        } catch { return false; }
    }

    // ========== UI 进度控制 ==========
    function showProgress(title, text, percent) {
        const overlay = document.getElementById('loadingOverlay');
        overlay.classList.remove('hidden');
        if (title) document.getElementById('loadingTitle').textContent = title;
        if (text !== undefined) document.getElementById('progressText').textContent = text;
        if (percent !== undefined) document.getElementById('progressFill').style.width = Math.min(100, Math.max(0, percent)) + '%';
    }

    function hideProgress() {
        document.getElementById('loadingOverlay').classList.add('hidden');
    }

    function formatBytes(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    // ========== 核心：执行字典脚本并等待就绪 ==========
    function executeDictScript(text) {
        return new Promise((resolve, reject) => {
            const prevLen = window.dict ? window.dict.length : 0;
            const script = document.createElement('script');
            script.textContent = text;
            document.head.appendChild(script);

            let attempts = 0;
            const maxAttempts = 300;
            const timer = setInterval(() => {
                attempts++;
                if (window.dict && window.dict.length > prevLen && window.dict.length > 0) {
                    clearInterval(timer);
                    resolve(window.dict);
                } else if (attempts >= maxAttempts) {
                    clearInterval(timer);
                    reject(new Error('字典脚本执行超时'));
                }
            }, 100);
        });
    }

    // ========== 真实进度下载 ==========
    async function downloadAndInstallDict() {
        showProgress('📥 正在下载字典', '连接服务器...', 0);

        try {
            const response = await fetch('./js/kobun_dict.js');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const contentLength = response.headers.get('Content-Length');
            const total = contentLength ? parseInt(contentLength, 10) : 0;

            if (!response.body || !total) {
                showProgress('📥 正在下载字典', '大小未知，请稍候...', 50);
                const rawText = await response.text();
                await processDictText(rawText);
                return;
            }

            const reader = response.body.getReader();
            let received = 0;
            const chunks = [];

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                chunks.push(value);
                received += value.length;

                const pct = Math.round((received / total) * 100);
                const sizeText = `${formatBytes(received)} / ${formatBytes(total)} (${pct}%)`;
                showProgress('📥 正在下载字典', sizeText, pct);
            }

            const decoder = new TextDecoder('utf-8');
            const rawText = chunks.map(c => decoder.decode(c, { stream: true })).join('') + decoder.decode();
            await processDictText(rawText);

        } catch (err) {
            console.error('字典下载失败:', err);
            showProgress('❌ 加载失败', err.message, 0);
            setTimeout(() => {
                hideProgress();
                if (confirm(`字典加载失败：${err.message}\n\n是否重试？`)) {
                    clearDictFromDB().then(() => downloadAndInstallDict());
                }
            }, 1500);
        }
    }

    async function processDictText(rawText) {
        try {
            showProgress('📦 正在解析字典', '请稍候...', 90);
            const dictData = await executeDictScript(rawText);

            showProgress('💾 正在保存缓存', '即将完成...', 95);
            await saveDictToDB(dictData);
            dict = dictData;
            dictReady = true;

            showProgress('✅ 字典就绪', `共 ${dict.length} 个词条`, 100);
            setTimeout(hideProgress, 800);
        } catch (err) {
            throw err;
        }
    }

    // ========== 古典日语业务逻辑 ==========
    function look_up_dict(kanji) {
        var ans = [[], [], []];
        kanji = kata_to_hira(kanji);
        for (var i = 0; i < dict.length; i++) {
            if (kata_to_hira(dict[i].kaki) == kanji || kata_to_hira(dict[i].yomi) == kanji) {
                if (dict[i].kaki == '')
                    ans[2].push(dict[i].yomi);
                else
                    ans[2].push(dict[i].kaki);
                ans[0].push(dict[i].yomi);
                ans[1].push(dict[i].type);
            }
        }
        return ans;
    }

    function work(x) {
        if (!dictReady) {
            document.getElementById('result').textContent = '⏳ 字典加载中，请稍候...';
            return;
        }
        var verb = document.getElementById('verb').value;
        verb = verb.replace(/\s*/g, '');
        verb = romaji_to_hiragana(verb);
        if (verb == '') {
            document.getElementById('result').textContent = '';
            return;
        }
        var dict_result = look_up_dict(verb);
        var result = '';
        for (var i = 0; i < dict_result[0].length; i++) {
            var dan = dict_result[1][i];
            result = result + get_result(dict_result[0][i], dan, dict_result[2][i]) + '\n\n';
        }
        if (result == '') result = '找不到"' + verb + '"，变形失败。';
        document.getElementById('result').textContent = result;
        document.getElementById('verb').focus();
        document.getElementById('verb').setSelectionRange(0, document.getElementById('verb').value.length);
    }

    // ========== 页面初始化 ==========
    window.addEventListener('load', async () => {
        showProgress('📖 正在加载字典', '读取本地缓存...', 30);
        const cached = await loadDictFromDB();

        if (cached && cached.length > 0) {
            dict = cached;
            dictReady = true;
            showProgress('✅ 字典就绪', `共 ${dict.length} 个词条（本地缓存）`, 100);
            setTimeout(hideProgress, 600);
        } else {
            await downloadAndInstallDict();
        }

        document.getElementById('verb').focus();
        document.getElementById('verb').setSelectionRange(0, document.getElementById('verb').value.length);
    });
</script>
</body>
</html>
