<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古典日语动词变形</title>
    <link rel='icon' type='image/x-icon' href='icon/6.ico'/>
    <script type='text/javascript' src='js/kobun_trans.js'></script>
    <script type='text/javascript' src='js/romaji.js'></script>
    <script type='text/javascript' src='js/kobun_dict.js'></script>
    <script type='text/javascript'>
    function look_up_dict(kanji)
    {
        var ans = [[],[],[]];
        kanji = kata_to_hira(kanji);
        for(var i=0;i<dict.length;i++)
        {
            if(kata_to_hira(dict[i].kaki) == kanji || kata_to_hira(dict[i].yomi) == kanji)
            {
                if(dict[i].kaki == '')
                    ans[2].push(dict[i].yomi);
                else
                    ans[2].push(dict[i].kaki);
                ans[0].push(dict[i].yomi);
                ans[1].push(dict[i].type);
            }
        }
        return ans;
    }
    function work(x)
    {
        var verb = document.getElementById('verb').value;
        verb = verb.replace(/\s*/g,'');
        verb = romaji_to_hiragana(verb);
        if(verb == '')
        {
            document.getElementById('result').textContent = '';
            return;
        }
        var dict_result = look_up_dict(verb);

        //alert(verb);
        var result = '';
        for(var i=0;i<dict_result[0].length;i++)
        {
            var dan = dict_result[1][i];
            result = result + get_result(dict_result[0][i],dan,dict_result[2][i]) + '\n\n';
        }
        if(result == '')
            result = '找不到“' + verb + '”，变形失败。'
        document.getElementById('result').textContent = result;
        document.getElementById('verb').focus();
        document.getElementById('verb').setSelectionRange(0,document.getElementById('verb').value.length);
    }
    function IsPC() {
        var userAgentInfo = navigator.userAgent;
        var Agents = ["Android", "iPhone",
            "SymbianOS", "Windows Phone",
            "iPad", "iPod"];
        var flag = true;
        for (var v = 0; v < Agents.length; v++) {
            if (userAgentInfo.indexOf(Agents[v]) > 0) {
                flag = false;
                break;
            }
        }
        return flag;
    }
    function zload()
    {
        //if(!IsPC())
        //    window.location.href='J2.html';
        document.getElementById('verb').focus();
        document.getElementById('verb').setSelectionRange(0,document.getElementById('verb').value.length);
    }
</script>
    <style>
    /* 保留原始 .one 类定义 */
    .one {
        font-size: 24px;
        white-space: pre-line;
    }

    /* 美化样式 - 不涉及任何 font-family 修改 */
    body {
        text-align: center;
        background: linear-gradient(135deg, #fdfbf7 0%, #f5f0e8 100%);
        min-height: 100vh;
        margin: 0;
        padding: 40px 20px;
        color: #3d3d3d;
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 16px;
        padding: 50px 40px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    h1 {
        margin: 0 0 30px 0;
        color: #5b4a3f;
        letter-spacing: 2px;
    }

    .input-section {
        display: flex;
        gap: 15px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 30px;
    }

    #verb {
        font-size: 40px;
        padding: 12px 20px;
        border: 2px solid #d4c5b0;
        border-radius: 10px;
        outline: none;
        text-align: center;
        width: 280px;
        background: #fffdf9;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    #verb:focus {
        border-color: #8b7355;
        box-shadow: 0 0 0 3px rgba(139, 115, 85, 0.15);
    }

    button {
        font-size: 40px;
        padding: 12px 30px;
        background: #8b7355;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.3s ease, transform 0.15s ease;
        line-height: 1.2;
    }

    button:hover {
        background: #6d5a43;
    }

    button:active {
        transform: scale(0.97);
    }

    hr {
        border: none;
        height: 1px;
        background: linear-gradient(to right, transparent, #d4c5b0, transparent);
        margin: 30px 0;
    }

    #result {
        font-size: 40px;
        word-break: break-all;
        word-wrap: break-word;
        display: block;
        min-height: 60px;
        text-align: left;
        padding: 20px;
        background: #fffdf9;
        border-radius: 10px;
        border: 1px solid #ede6da;
        line-height: 1.6;
        color: #3d3d3d;
    }

    /* 移动端适配 */
    @media (max-width: 640px) {
        body { padding: 20px 10px; }
        .container { padding: 30px 20px; }
        h1 { font-size: 1.5rem; }
        .input-section { flex-direction: column; }
        #verb { width: 100%; font-size: 28px; }
        button { width: 100%; font-size: 28px; }
        #result { font-size: 28px; padding: 15px; }
    }
</style>
</head>

<body onload="zload()">
<div class="container">
    <h1>古典日语动词变形器</h1>

    <div class="input-section">
        <input type='text' id='verb' value='食ぶ' placeholder='输入动词(终止形)' onkeyup="if(event.keyCode==13){work(this);}">
        <button type="button" onclick="work(this)">开始转换</button>
    </div>

    <hr>

    <label id='result' class='one'></label>
</div>
</body>
</html>
