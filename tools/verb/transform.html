<!DOCTYPE html>
<html lang="zh-CN">
<head>
        <meta charset='utf-8'>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>日语动词变形器</title>
        <link rel='icon' type='image/x-icon' href='icon/6.ico'/>
        <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #333;
        }
        .container {
            max-width: 900px; margin: 0 auto; background: white;
            border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 30px; text-align: center;
        }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .content { padding: 40px; }
        .input-label { display: block; font-size: 18px; font-weight: 600; margin-bottom: 15px; color: #555; }
        #verb {
            width: 100%; font-size: 28px; padding: 18px 20px;
            border: 2px solid #e0e0e0; border-radius: 12px; outline: none;
            transition: all 0.3s; font-family: inherit;
        }
        #verb:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .result-section {
            background: #f8f9fa; border-radius: 12px; padding: 25px;
            min-height: 200px; white-space: pre-line; font-size: 24px;
            line-height: 1.8; word-break: break-all; word-wrap: break-word;
        }
        .result-section:empty::before { content: "变形结果将显示在这里..."; color: #999; font-size: 18px; }

        /* 全屏加载遮罩 */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.3s;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-title { font-size: 22px; font-weight: 600; margin-bottom: 20px; color: #333; }
        .progress-bar { width: 300px; max-width: 80%; height: 10px; background: #e0e0e0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 0%; transition: width 0.3s; }
        .progress-text { margin-top: 12px; font-size: 14px; color: #666; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .header { padding: 20px; }
            .header h1 { font-size: 24px; }
            .content { padding: 20px; }
            #verb { font-size: 22px; padding: 15px; }
            .result-section { font-size: 20px; padding: 20px; }
        }
    </style>
</head>
<body>
<!-- 全屏加载遮罩 -->
<div class="loading-overlay" id="loadingOverlay">
        <div class="loading-title" id="loadingTitle">正在初始化...</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">准备中...</div>
</div>

<div class="container">
        <div class="header">
                <h1>日语动词变形器</h1>
                <p>输入动词基本形，查看所有变形形式</p>
        </div>
        <div class="content">
                <div style="margin-bottom:30px;">
                        <label class="input-label" for="verb">输入动词（基本形）</label>
                        <input type='text' id='verb' value='食べる' placeholder="例如：食べる、行く、する" onkeyup="if(event.keyCode==13){work(this);}">
                </div>
                <div class="result-section" id='result'></div>
        </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type='text/javascript' src='js/trans.js'></script>
<script type='text/javascript' src='js/romaji.js'></script>

<script>
        var dict = [];
        const DB_NAME = 'VerbConjugatorDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'dictionary';
        let db = null;

        // ========== IndexedDB 操作 ==========
        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onerror = () => reject(req.error);
                req.onsuccess = () => { db = req.result; resolve(db); };
                req.onupgradeneeded = (e) => {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains(STORE_NAME)) d.createObjectStore(STORE_NAME, { keyPath: 'id' });
                };
            });
        }

        async function loadDictFromDB() {
            try {
                await initDB();
                return new Promise((resolve) => {
                    const tx = db.transaction([STORE_NAME], 'readonly');
                    const req = tx.objectStore(STORE_NAME).get('dict');
                    req.onsuccess = () => resolve(req.result ? req.result.data : null);
                    req.onerror = () => resolve(null);
                });
            } catch { return null; }
        }

        async function saveDictToDB(data) {
            try {
                await initDB();
                return new Promise((resolve) => {
                    const tx = db.transaction([STORE_NAME], 'readwrite');
                    tx.objectStore(STORE_NAME).put({ id: 'dict', data, timestamp: Date.now() });
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch { return false; }
        }

        async function clearDictFromDB() {
            try {
                await initDB();
                return new Promise((resolve) => {
                    const tx = db.transaction([STORE_NAME], 'readwrite');
                    tx.objectStore(STORE_NAME).delete('dict');
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch { return false; }
        }

        // ========== UI 进度控制 ==========
        function showProgress(title, text, percent) {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.remove('hidden');
            if (title) document.getElementById('loadingTitle').textContent = title;
            if (text !== undefined) document.getElementById('progressText').textContent = text;
            if (percent !== undefined) document.getElementById('progressFill').style.width = percent + '%';
        }

        function hideProgress() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // ========== 核心：通过动态脚本执行 dict.js 并等待 dict 就绪 ==========
        function executeDictScript(text) {
            return new Promise((resolve, reject) => {
                const prevLen = window.dict ? window.dict.length : 0;
                const script = document.createElement('script');
                script.textContent = text;

                document.head.appendChild(script);

                let attempts = 0;
                const maxAttempts = 200; // 最多等待 20秒
                const timer = setInterval(() => {
                    attempts++;
                    if (window.dict && window.dict.length > prevLen && window.dict.length > 0) {
                        clearInterval(timer);
                        resolve(window.dict);
                    } else if (attempts >= maxAttempts) {
                        clearInterval(timer);
                        reject(new Error('字典脚本执行超时，未能生成有效字典数据'));
                    }
                }, 100);
            });
        }

        // ========== 下载并安装字典 ==========
        async function downloadAndInstallDict() {
            showProgress('📥 正在下载字典', '连接服务器...', 0);

            try {
                if (!('serviceWorker' in navigator)) throw new Error('浏览器不支持 Service Worker');

                // 使用 controller 而不是 registration.active
                const sw = navigator.serviceWorker.controller;
                if (!sw) throw new Error('Service Worker 未控制当前页面，请刷新重试');

                // 发送下载指令
                sw.postMessage({ type: 'DOWNLOAD_DICT', url: './js/dict.js' });

                // 等待 SW 返回原始文件内容，增加超时检测
                const rawText = await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => {
                        navigator.serviceWorker.removeEventListener('message', handler);
                        reject(new Error('下载超时（30秒无响应），请检查网络或刷新页面'));
                    }, 600000); // 30秒超时

                    const handler = (event) => {
                        const { type, progress, total, received, text, error } = event.data;
                        if (type === 'PROGRESS') {
                            const pct = total > 0 ? Math.round((received / total) * 100) : Math.min(95, Math.round(received / 1024));
                            const sizeText = total > 0
                                ? `${formatBytes(received)} / ${formatBytes(total)} (${pct}%)`
                                : `${formatBytes(received)}（大小未知）`;
                            showProgress('📥 正在下载字典', sizeText, pct);
                        } else if (type === 'COMPLETE_TEXT') {
                            clearTimeout(timeout);
                            navigator.serviceWorker.removeEventListener('message', handler);
                            resolve(text);
                        } else if (type === 'ERROR') {
                            clearTimeout(timeout);
                            navigator.serviceWorker.removeEventListener('message', handler);
                            reject(new Error(error));
                        }
                    };
                    navigator.serviceWorker.addEventListener('message', handler);
                });

                // 下载完成，开始执行脚本解压字典
                showProgress('📦 正在解压字典', '请稍候...', 90);
                const dictData = await executeDictScript(rawText);

                // 保存到 IndexedDB
                showProgress('💾 正在保存字典', '即将完成...', 95);
                await saveDictToDB(dictData);
                dict = dictData;

                showProgress('✅ 字典就绪', `共 ${dict.length} 个词条`, 100);
                setTimeout(hideProgress, 800);

            } catch (err) {
                console.error('字典下载安装失败:', err);
                showProgress('❌ 字典加载失败', err.message, 0);

                setTimeout(() => {
                    hideProgress();
                    if (confirm(`字典加载失败：${err.message}\n\n是否重新下载？`)) {
                        clearDictFromDB().then(() => downloadAndInstallDict());
                    }
                }, 1500);
            }
        }

        // ========== 核心查询与变形逻辑 ==========
        function look_up_dict(kanji) {
            var ans = [[],[]];
            kanji = kata_to_hira(kanji);
            for(var i=0;i<dict.length;i++) {
                if(kata_to_hira(dict[i].kaki) == kanji || kata_to_hira(dict[i].yomi) == kanji) {
                    if(dict[i].kaki == '') ans[0].push(dict[i].yomi);
                    else ans[0].push(dict[i].kaki);
                    if(dict[i].type == 'vs') ans[0][ans[0].length-1] = ans[0][ans[0].length-1] + 'する';
                    ans[1].push(dict[i].type);
                }
                else if (dict[i].type.slice(0,2) == 'vs' && (dict[i].kaki != '' && kata_to_hira(dict[i].kaki) + 'する' == kanji) || kata_to_hira(dict[i].yomi) + 'する' == kanji) {
                    if(dict[i].kaki == '') ans[0].push(dict[i].yomi + 'する');
                    else ans[0].push(dict[i].kaki + 'する');
                    ans[1].push(dict[i].type);
                }
            }
            return ans;
        }

        function work(x) {
            var verb = document.getElementById('verb').value;
            verb = verb.replace(/\s*/g,'');
            verb = romaji_to_hiragana(verb);
            if(verb == '') { document.getElementById('result').textContent = ''; return; }
            var dict_result = look_up_dict(verb);
            var result = '';
            for(var i=0;i<dict_result[0].length;i++) {
                var dan = dict_result[1][i];
                if(dan[1] != '1' && dan[1] != '5' && dan[1] != 's' && dan[1] != 'k') continue;
                result = result + get_result(dict_result[0][i],dan) + '\n\n';
            }
            if(result == '') result = '找不到"' + verb + '"，请检查是否正确的输入了现代日语的动词。';
            document.getElementById('result').textContent = result;
            document.getElementById('verb').focus();
            document.getElementById('verb').setSelectionRange(0,document.getElementById('verb').value.length);
        }

        // ========== 页面初始化 ==========
       window.addEventListener('load', async () => {
            if ('serviceWorker' in navigator) {
                try {
                    const reg = await navigator.serviceWorker.register('./sw.js');
                    console.log('[Main] SW 注册成功, scope:', reg.scope);

                    // ⚡ 不再依赖 ready，改用 controller + 轮询兜底
                    const waitForController = (timeoutMs = 10000) => {
                        return new Promise((resolve) => {
                            // 如果已经有 controller，直接返回
                            if (navigator.serviceWorker.controller) {
                                console.log('[Main] Controller 已存在:', navigator.serviceWorker.controller.scriptURL);
                                return resolve();
                            }

                            console.log('[Main] 等待 controller...');
                            const start = Date.now();
                            const timer = setInterval(() => {
                                if (navigator.serviceWorker.controller) {
                                    clearInterval(timer);
                                    console.log('[Main] Controller 就绪:', navigator.serviceWorker.controller.scriptURL);
                                    resolve();
                                } else if (Date.now() - start > timeoutMs) {
                                    clearInterval(timer);
                                    console.warn('[Main] Controller 等待超时(10s)，当前 controller:', navigator.serviceWorker.controller);
                                    resolve(); // 超时也继续，后续逻辑会处理 null 的情况
                                }
                            }, 200);

                            // 同时监听 controllerchange 事件
                            navigator.serviceWorker.addEventListener('controllerchange', () => {
                                clearInterval(timer);
                                console.log('[Main] controllerchange 触发, controller:', navigator.serviceWorker.controller?.scriptURL);
                                resolve();
                            });
                        });
                    };

                    await waitForController();

                    // 处理更新
                    if (reg.waiting) {
                        console.log('[Main] 发现 waiting SW，发送 SKIP_WAITING');
                        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                    }
                    reg.addEventListener('updatefound', () => {
                        const nw = reg.installing;
                        nw?.addEventListener('statechange', () => {
                            console.log('[Main] SW state:', nw.state);
                            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                                nw.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                } catch(e) {
                    console.error('[Main] SW 注册失败:', e);
                }
            }

            // 尝试从本地读取
            showProgress('📖 正在加载字典', '读取本地缓存...', 30);
            const cached = await loadDictFromDB();

            if (cached && cached.length > 0) {
                // 本地有缓存，验证有效性
                dict = cached;
                showProgress('✅ 字典就绪', `共 ${dict.length} 个词条（本地缓存）`, 100);
                setTimeout(hideProgress, 600);
            } else {
                // 无缓存，自动下载
                await downloadAndInstallDict();
            }

            document.getElementById('verb').focus();
            document.getElementById('verb').setSelectionRange(0, document.getElementById('verb').value.length);
        });
    </script>
</body>
</html>
