<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日语口语练习</title>
    <style>
/* ==================== CSS 变量 & 主题 ==================== */
:root {
  --bg-primary: #f0f2f5;
  --bg-secondary: #ffffff;
  --bg-sidebar: #f7f8fa;
  --bg-input: #ffffff;
  --bg-user-msg: #0084ff;
  --bg-ai-msg: #e9ecef;
  --text-primary: #1a1a2e;
  --text-secondary: #65676b;
  --text-user-msg: #ffffff;
  --text-ai-msg: #1a1a2e;
  --border-color: #e0e0e0;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --accent: #0084ff;
  --accent-hover: #006fdb;
  --danger: #e74c3c;
  --radius: 12px;
  --transition: all 0.3s ease;
}

[data-theme="dark"] {
  --bg-primary: #1a1a2e;
  --bg-secondary: #16213e;
  --bg-sidebar: #0f1129;
  --bg-input: #16213e;
  --bg-user-msg: #0084ff;
  --bg-ai-msg: #2a2a4a;
  --text-primary: #e0e0e0;
  --text-secondary: #a0a0b0;
  --text-user-msg: #ffffff;
  --text-ai-msg: #e0e0e0;
  --border-color: #2a2a4a;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --accent: #4dabf7;
  --accent-hover: #339af0;
}

/* ==================== 全局样式 ==================== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  transition: var(--transition);
}

/* ==================== 整体布局 ==================== */
.app-container {
  display: flex;
  height: 100vh;
  position: relative;
}

/* ==================== 侧栏 ==================== */
.sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  transition: var(--transition);
  z-index: 100;
}

.sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.sidebar-header h2 {
  font-size: 18px;
  font-weight: 600;
  white-space: nowrap;
}

.sidebar-header-actions {
  display: flex;
  gap: 6px;
}

.sidebar-header-actions button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
  padding: 6px;
  border-radius: 8px;
  transition: var(--transition);
  color: var(--text-primary);
}

.sidebar-header-actions button:hover {
  background: var(--border-color);
}

.conversation-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.conversation-item {
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  margin-bottom: 4px;
  transition: var(--transition);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.conversation-item:hover {
  background: var(--border-color);
}

.conversation-item.active {
  background: var(--accent);
  color: white;
}

.conversation-item.active .conv-time {
  color: rgba(255,255,255,0.7);
}

.conv-info {
  flex: 1;
  min-width: 0;
}

.conv-title {
  font-size: 14px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.conv-time {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.conv-delete {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 14px;
  opacity: 0;
  transition: var(--transition);
  padding: 4px;
  border-radius: 4px;
  color: inherit;
}

.conversation-item:hover .conv-delete {
  opacity: 0.6;
}

.conv-delete:hover {
  opacity: 1 !important;
  background: rgba(231,76,60,0.2);
}

/* ==================== 主区域 ==================== */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* 顶部栏 */
.top-bar {
  padding: 12px 20px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.top-bar-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.menu-btn {
  display: none;
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  padding: 4px;
  color: var(--text-primary);
}

.top-bar-title {
  font-size: 16px;
  font-weight: 600;
}

.top-bar-right {
  display: flex;
  gap: 8px;
}

.top-bar-right button {
  background: none;
  border: 1px solid var(--border-color);
  cursor: pointer;
  font-size: 18px;
  padding: 6px 10px;
  border-radius: 8px;
  transition: var(--transition);
  color: var(--text-primary);
}

.top-bar-right button:hover {
  background: var(--border-color);
}

/* ==================== 消息区域 ==================== */
.messages-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

.message-row {
  display: flex;
  gap: 10px;
  max-width: 80%;
  animation: fadeInUp 0.3s ease;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.message-row.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.message-row.ai {
  align-self: flex-start;
}

.message-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.message-row.user .message-avatar {
  background: var(--accent);
  color: white;
}

.message-row.ai .message-avatar {
  background: #ff6b6b;
  color: white;
}

.message-bubble {
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.6;
  position: relative;
  word-break: break-word;
}

.message-row.user .message-bubble {
  background: var(--bg-user-msg);
  color: var(--text-user-msg);
  border-bottom-right-radius: 4px;
}

.message-row.ai .message-bubble {
  background: var(--bg-ai-msg);
  color: var(--text-ai-msg);
  border-bottom-left-radius: 4px;
}

.message-actions {
  display: flex;
  gap: 4px;
  margin-top: 6px;
}

.message-actions button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 14px;
  padding: 2px 6px;
  border-radius: 4px;
  transition: var(--transition);
  opacity: 0.6;
}

.message-actions button:hover {
  opacity: 1;
  background: rgba(0,0,0,0.1);
}

.message-row.user .message-actions button {
  color: var(--text-user-msg);
}

.message-row.ai .message-actions button {
  color: var(--text-ai-msg);
}

/* 用户消息可编辑状态 */
.message-bubble.editing textarea {
  width: 100%;
  min-height: 60px;
  border: 2px solid var(--accent);
  border-radius: 8px;
  padding: 8px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  background: var(--bg-input);
  color: var(--text-primary);
}

.message-bubble.editing .edit-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.message-bubble.editing .edit-actions button {
  padding: 4px 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
}

.btn-resend {
  background: var(--accent);
  color: white;
}

.btn-resend:hover {
  background: var(--accent-hover);
}

.btn-cancel-edit {
  background: var(--border-color);
  color: var(--text-primary);
}

/* 打字指示器 */
.typing-indicator {
  display: flex;
  gap: 4px;
  padding: 4px 0;
}

.typing-indicator span {
  width: 6px;
  height: 6px;
  background: var(--text-secondary);
  border-radius: 50%;
  animation: typing 1.4s infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* 空状态 */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  gap: 12px;
}

.empty-state .icon {
  font-size: 64px;
}

.empty-state p {
  font-size: 15px;
}

/* ==================== 输入区域 ==================== */
.input-area {
  padding: 12px 20px 16px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border-color);
}

.input-wrapper {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.input-wrapper textarea {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  min-height: 42px;
  max-height: 120px;
  background: var(--bg-input);
  color: var(--text-primary);
  transition: var(--transition);
  line-height: 1.5;
}

.input-wrapper textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,132,255,0.15);
}

.input-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  flex-shrink: 0;
}

.btn-send {
  background: var(--accent);
  color: white;
}

.btn-send:hover {
  background: var(--accent-hover);
  transform: scale(1.05);
}

.btn-send:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.btn-mic {
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
}

.btn-mic:hover {
  background: var(--border-color);
}

.btn-mic.recording {
  background: #e74c3c;
  color: white;
  border-color: #e74c3c;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(231,76,60,0.4); }
  50% { box-shadow: 0 0 0 10px rgba(231,76,60,0); }
}

/* ==================== 设置面板 ==================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition);
}

.modal-overlay.show {
  opacity: 1;
  visibility: visible;
}

.modal {
  background: var(--bg-secondary);
  border-radius: 16px;
  padding: 24px;
  width: 90%;
  max-width: 500px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  transform: translateY(20px);
  transition: var(--transition);
}

.modal-overlay.show .modal {
  transform: translateY(0);
}

.modal h3 {
  font-size: 18px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  background: var(--bg-input);
  color: var(--text-primary);
  transition: var(--transition);
}

.form-group input:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--accent);
}

.form-group textarea {
  min-height: 80px;
  resize: vertical;
}

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 20px;
}

.modal-actions button {
  padding: 8px 20px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: var(--transition);
}

.modal-actions .btn-save {
  background: var(--accent);
  color: white;
}

.modal-actions .btn-save:hover {
  background: var(--accent-hover);
}

.modal-actions .btn-close {
  background: var(--border-color);
  color: var(--text-primary);
}

/* ==================== Toast 提示 ==================== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #333;
  color: white;
  padding: 10px 24px;
  border-radius: 10px;
  font-size: 14px;
  z-index: 2000;
  transition: transform 0.3s ease;
  white-space: nowrap;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
}

/* ==================== 响应式 ==================== */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: -280px;
    top: 0;
    bottom: 0;
    box-shadow: var(--shadow);
  }

  .sidebar.open {
    left: 0;
  }

  .menu-btn {
    display: block;
  }

  .sidebar-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 99;
    display: none;
  }

  .sidebar-backdrop.show {
    display: block;
  }

  .message-row {
    max-width: 90%;
  }
}

/* ==================== 滚动条 ==================== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
</style>
</head>
<body>

<!-- ==================== 主容器 ==================== -->
<div class="app-container">
    <!-- 侧栏背景遮罩（移动端） -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- 侧栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>🗾 对话列表</h2>
            <div class="sidebar-header-actions">
                <button onclick="createConversation()" title="新建对话">➕</button>
            </div>
        </div>
        <div class="conversation-list" id="conversationList"></div>
    </aside>

    <!-- 主区域 -->
    <main class="main-area">
        <!-- 顶部栏 -->
        <div class="top-bar">
            <div class="top-bar-left">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <span class="top-bar-title" id="topBarTitle">日语口语练习</span>
            </div>
            <div class="top-bar-right">
                <button onclick="openSettings()" title="设置">⚙️</button>
                <button onclick="toggleTheme()" title="切换主题" id="themeBtn">🌙</button>
            </div>
        </div>

        <!-- 消息区域 -->
        <div class="messages-area" id="messagesArea">
            <div class="empty-state">
                <div class="icon">🎌</div>
                <p>开始你的日语口语练习吧！</p>
                <p style="font-size:13px">点击下方麦克风按钮或输入文字开始对话</p>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="input-area">
            <div class="input-wrapper">
                <button class="input-btn btn-mic" id="micBtn" onclick="toggleRecording()" title="语音输入">🎤</button>
                <textarea id="inputText" rows="1" placeholder="输入消息或点击麦克风说话..." onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
                <button class="input-btn btn-send" id="sendBtn" onclick="sendMessage()" title="发送">➤</button>
            </div>
        </div>
    </main>
</div>

<!-- ==================== 设置弹窗 ==================== -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal">
        <h3>⚙️ 大模型设置</h3>
        <div class="form-group">
            <label>API Base URL</label>
            <input type="text" id="cfgBaseUrl" placeholder="例如: https://api.openai.com">
        </div>
        <div class="form-group">
            <label>API Key</label>
            <input type="password" id="cfgApiKey" placeholder="sk-...">
        </div>
        <div class="form-group">
            <label>模型名称</label>
            <input type="text" id="cfgModel" placeholder="例如: gpt-4o">
        </div>
        <div class="form-group">
            <label>系统提示词</label>
            <textarea id="cfgSystemPrompt"></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn-close" onclick="closeSettings()">取消</button>
            <button class="btn-save" onclick="saveSettings()">保存</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// 全局变量与常量
// ============================================================
const DB_NAME = 'japanese-practice';
const DB_VERSION = 1;
const STORE_CONVS = 'conversations';
const STORE_MSGS = 'messages';

let db = null;
let conversations = [];       // [{id, title, createdAt}]
let currentConvId = null;     // 当前对话 ID
let currentMessages = [];     // 当前对话的消息 [{id, convId, role, content, createdAt}]
let isStreaming = false;       // 是否正在流式接收
let abortController = null;    // 用于中止 fetch

// 语音识别
let recognition = null;
let isRecording = false;

// 默认系统提示词
const DEFAULT_SYSTEM_PROMPT = '你是一位耐心友好的日语口语老师。请全程使用日语与用户对话，语速适中，用词自然。如果用户表达有误，请温和地纠正并给出正确说法。回复请简洁，每次不超过3-4句话。';

// ============================================================
// IndexedDB 操作
// ============================================================
function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_CONVS)) {
        db.createObjectStore(STORE_CONVS, { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains(STORE_MSGS)) {
        const msgStore = db.createObjectStore(STORE_MSGS, { keyPath: 'id' });
        msgStore.createIndex('convId', 'convId', { unique: false });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      resolve(db);
    };
    request.onerror = (e) => reject(e.target.error);
  });
}

function dbTransaction(storeNames, mode) {
  const tx = db.transaction(storeNames, mode);
  return storeNames.length === 1 ? tx.objectStore(storeNames[0]) : storeNames.map(n => tx.objectStore(n));
}

function dbAdd(storeName, data) {
  return new Promise((resolve, reject) => {
    const store = dbTransaction([storeName], 'readwrite');
    const req = store.add(data);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

function dbPut(storeName, data) {
  return new Promise((resolve, reject) => {
    const store = dbTransaction([storeName], 'readwrite');
    const req = store.put(data);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

function dbDelete(storeName, key) {
  return new Promise((resolve, reject) => {
    const store = dbTransaction([storeName], 'readwrite');
    const req = store.delete(key);
    req.onsuccess = () => resolve();
    req.onerror = (e) => reject(e.target.error);
  });
}

function dbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const store = dbTransaction([storeName], 'readonly');
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

function dbGetByIndex(storeName, indexName, value) {
  return new Promise((resolve, reject) => {
    const store = dbTransaction([storeName], 'readonly');
    const index = store.index(indexName);
    const req = index.getAll(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

// ============================================================
// 初始化
// ============================================================
async function init() {
  // 加载主题
  const theme = localStorage.getItem('jp-theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeBtn(theme);

  // 加载设置
  loadSettings();

  // 打开数据库
  await openDB();

  // 加载对话列表
  conversations = await dbGetAll(STORE_CONVS);
  conversations.sort((a, b) => a.createdAt - b.createdAt);

  renderConversationList();

  // 如果有对话，打开最后一个
  if (conversations.length > 0) {
    await switchConversation(conversations[conversations.length - 1].id);
  }
}

// ============================================================
// 设置管理
// ============================================================
function loadSettings() {
  const baseUrl = localStorage.getItem('jp-api-base') || '';
  const apiKey = localStorage.getItem('jp-api-key') || '';
  const model = localStorage.getItem('jp-model') || '';
  const systemPrompt = localStorage.getItem('jp-system-prompt') || DEFAULT_SYSTEM_PROMPT;

  document.getElementById('cfgBaseUrl').value = baseUrl;
  document.getElementById('cfgApiKey').value = apiKey;
  document.getElementById('cfgModel').value = model;
  document.getElementById('cfgSystemPrompt').value = systemPrompt;
}

function saveSettings() {
  localStorage.setItem('jp-api-base', document.getElementById('cfgBaseUrl').value.trim());
  localStorage.setItem('jp-api-key', document.getElementById('cfgApiKey').value.trim());
  localStorage.setItem('jp-model', document.getElementById('cfgModel').value.trim());
  localStorage.setItem('jp-system-prompt', document.getElementById('cfgSystemPrompt').value.trim());
  closeSettings();
  showToast('✅ 设置已保存');
}

function openSettings() {
  document.getElementById('settingsModal').classList.add('show');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('show');
}

// ============================================================
// 主题切换
// ============================================================
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('jp-theme', next);
  updateThemeBtn(next);
}

function updateThemeBtn(theme) {
  document.getElementById('themeBtn').textContent = theme === 'light' ? '🌙' : '☀️';
}

// ============================================================
// 侧栏（移动端）
// ============================================================
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebarBackdrop');
  sidebar.classList.toggle('open');
  backdrop.classList.toggle('show');
}

document.getElementById('sidebarBackdrop').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
});

// ============================================================
// 对话管理
// ============================================================
function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

async function createConversation() {
  const conv = {
    id: generateId(),
    title: '新对话',
    createdAt: Date.now()
  };
  await dbAdd(STORE_CONVS, conv);
  conversations.push(conv);
  renderConversationList();
  await switchConversation(conv.id);
  closeSidebarMobile();
}

async function switchConversation(convId) {
  currentConvId = convId;
  currentMessages = await dbGetByIndex(STORE_MSGS, 'convId', convId);
  currentMessages.sort((a, b) => a.createdAt - b.createdAt);
  renderMessages();
  renderConversationList();

  const conv = conversations.find(c => c.id === convId);
  document.getElementById('topBarTitle').textContent = conv ? conv.title : '日语口语练习';
}

async function deleteConversation(convId) {
  // 只能删除列表最后一个
  if (conversations.length === 0) return;
  const lastConv = conversations[conversations.length - 1];
  if (lastConv.id !== convId) {
    showToast('⚠️ 请从最后一个对话开始依次删除');
    return;
  }

  // 删除对话下的所有消息
  const msgs = await dbGetByIndex(STORE_MSGS, 'convId', convId);
  for (const msg of msgs) {
    await dbDelete(STORE_MSGS, msg.id);
  }

  // 删除对话
  await dbDelete(STORE_CONVS, convId);
  conversations.pop();

  // 切换到最后一个对话或清空
  if (conversations.length > 0) {
    await switchConversation(conversations[conversations.length - 1].id);
  } else {
    currentConvId = null;
    currentMessages = [];
    renderMessages();
    document.getElementById('topBarTitle').textContent = '日语口语练习';
  }

  renderConversationList();
  showToast('🗑️ 对话已删除');
}

function renderConversationList() {
  const list = document.getElementById('conversationList');
  list.innerHTML = '';

  conversations.forEach(conv => {
    const item = document.createElement('div');
    item.className = 'conversation-item' + (conv.id === currentConvId ? ' active' : '');
    item.innerHTML = `
      <div class="conv-info" onclick="switchConversation('${conv.id}'); closeSidebarMobile();">
        <div class="conv-title">${escapeHtml(conv.title)}</div>
        <div class="conv-time">${formatTime(conv.createdAt)}</div>
      </div>
      <button class="conv-delete" onclick="event.stopPropagation(); deleteConversation('${conv.id}')" title="删除">🗑️</button>
    `;
    list.appendChild(item);
  });
}

function closeSidebarMobile() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
}

// ============================================================
// 消息渲染
// ============================================================
function renderMessages() {
  const area = document.getElementById('messagesArea');

  if (currentMessages.length === 0) {
    area.innerHTML = `
      <div class="empty-state">
        <div class="icon">🎌</div>
        <p>开始你的日语口语练习吧！</p>
        <p style="font-size:13px">点击下方麦克风按钮或输入文字开始对话</p>
      </div>
    `;
    return;
  }

  area.innerHTML = '';
  currentMessages.forEach((msg, idx) => {
    const row = createMessageElement(msg, idx);
    area.appendChild(row);
  });

  scrollToBottom();
}

function createMessageElement(msg, idx) {
  const row = document.createElement('div');
  row.className = `message-row ${msg.role}`;
  row.dataset.msgId = msg.id;

  const isLastUserMsg = msg.role === 'user' && idx === getLastUserMsgIndex();
  const isLast = idx === currentMessages.length - 1;

  const avatar = msg.role === 'user' ? '👤' : '🤖';

  let actionsHtml = '';
  if (msg.role === 'ai') {
    actionsHtml = `<button onclick="speakText(\`${escapeAttr(msg.content)}\`)" title="朗读">🔊</button>`;
  }
  if (isLastUserMsg && !isStreaming) {
    actionsHtml += `<button onclick="startEdit('${msg.id}')" title="编辑">✏️</button>`;
  }

  row.innerHTML = `
    <div class="message-avatar">${avatar}</div>
    <div>
      <div class="message-bubble" id="bubble-${msg.id}">${escapeHtml(msg.content)}</div>
      <div class="message-actions">${actionsHtml}</div>
    </div>
  `;

  return row;
}

function getLastUserMsgIndex() {
  for (let i = currentMessages.length - 1; i >= 0; i--) {
    if (currentMessages[i].role === 'user') return i;
  }
  return -1;
}

function scrollToBottom() {
  const area = document.getElementById('messagesArea');
  area.scrollTop = area.scrollHeight;
}

// ============================================================
// 编辑重发
// ============================================================
function startEdit(msgId) {
  const msg = currentMessages.find(m => m.id === msgId);
  if (!msg) return;

  const bubble = document.getElementById(`bubble-${msgId}`);
  if (!bubble) return;

  bubble.classList.add('editing');
  bubble.innerHTML = `
    <textarea id="editArea-${msgId}">${escapeHtml(msg.content)}</textarea>
    <div class="edit-actions">
      <button class="btn-resend" onclick="resendEdit('${msgId}')">重新发送</button>
      <button class="btn-cancel-edit" onclick="cancelEdit()">取消</button>
    </div>
  `;

  const textarea = document.getElementById(`editArea-${msgId}`);
  textarea.focus();
  textarea.setSelectionRange(textarea.value.length, textarea.value.length);
}

function cancelEdit() {
  renderMessages();
}

async function resendEdit(msgId) {
  const textarea = document.getElementById(`editArea-${msgId}`);
  if (!textarea) return;

  const newContent = textarea.value.trim();
  if (!newContent) {
    showToast('⚠️ 消息不能为空');
    return;
  }

  const msgIdx = currentMessages.findIndex(m => m.id === msgId);
  if (msgIdx === -1) return;

  // 更新用户消息
  const userMsg = currentMessages[msgIdx];
  userMsg.content = newContent;
  await dbPut(STORE_MSGS, userMsg);

  // 删除这条用户消息之后的所有消息（即最后一轮的AI回复）
  const toDelete = currentMessages.splice(msgIdx + 1);
  for (const m of toDelete) {
    await dbDelete(STORE_MSGS, m.id);
  }

  renderMessages();

  // 重新发送
  await callLLM(newContent);
}

// ============================================================
// 发送消息
// ============================================================
async function sendMessage() {
  const input = document.getElementById('inputText');
  const text = input.value.trim();
  if (!text || isStreaming) return;

  input.value = '';
  autoResize(input);

  // 确保有当前对话
  if (!currentConvId) {
    await createConversation();
  }

  // 保存用户消息
  const userMsg = {
    id: generateId(),
    convId: currentConvId,
    role: 'user',
    content: text,
    createdAt: Date.now()
  };
  await dbAdd(STORE_MSGS, userMsg);
  currentMessages.push(userMsg);

  // 更新对话标题（取第一条用户消息的前20字）
  const firstUserMsg = currentMessages.find(m => m.role === 'user');
  if (firstUserMsg) {
    const conv = conversations.find(c => c.id === currentConvId);
    if (conv) {
      conv.title = firstUserMsg.content.substring(0, 20) + (firstUserMsg.content.length > 20 ? '...' : '');
      await dbPut(STORE_CONVS, conv);
      document.getElementById('topBarTitle').textContent = conv.title;
      renderConversationList();
    }
  }

  renderMessages();

  // 调用大模型
  await callLLM(text);
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ============================================================
// 大模型调用（SSE 流式）
// ============================================================
async function callLLM(userText) {
  const baseUrl = localStorage.getItem('jp-api-base') || '';
  const apiKey = localStorage.getItem('jp-api-key') || '';
  const model = localStorage.getItem('jp-model') || '';
  const systemPrompt = localStorage.getItem('jp-system-prompt') || DEFAULT_SYSTEM_PROMPT;

  if (!baseUrl || !apiKey || !model) {
    showToast('⚠️ 请先在设置中配置 API');
    openSettings();
    return;
  }

  // 构建消息历史
  const messages = [{ role: 'system', content: systemPrompt }];
  currentMessages.forEach(m => {
    messages.push({ role: m.role === 'ai' ? 'assistant' : 'user', content: m.content });
  });

  // 创建 AI 消息占位
  const aiMsg = {
    id: generateId(),
    convId: currentConvId,
    role: 'ai',
    content: '',
    createdAt: Date.now()
  };
  await dbAdd(STORE_MSGS, aiMsg);
  currentMessages.push(aiMsg);

  // 添加占位 UI
  const area = document.getElementById('messagesArea');
  const row = document.createElement('div');
  row.className = 'message-row ai';
  row.dataset.msgId = aiMsg.id;
  row.innerHTML = `
    <div class="message-avatar">🤖</div>
    <div>
      <div class="message-bubble" id="bubble-${aiMsg.id}">
        <div class="typing-indicator"><span></span><span></span><span></span></div>
      </div>
      <div class="message-actions" id="actions-${aiMsg.id}"></div>
    </div>
  `;
  area.appendChild(row);
  scrollToBottom();

  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;
  abortController = new AbortController();

  try {
    const url = `${baseUrl.replace(/\/+$/, '')}/v1/chat/completions`;
    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: model,
        messages: messages,
        stream: true
      }),
      signal: abortController.signal
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`API 错误 (${response.status}): ${errText}`);
    }

    const bubble = document.getElementById(`bubble-${aiMsg.id}`);
    bubble.innerHTML = '';
    let fullContent = '';

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      // 解析 SSE 数据
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.startsWith('data:')) continue;

        const data = trimmed.slice(5).trim();
        if (data === '[DONE]') continue;

        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content || '';
          if (delta) {
            fullContent += delta;
            bubble.textContent = fullContent;
            scrollToBottom();
          }
        } catch (e) {
          // 忽略解析错误
        }
      }
    }

    // 保存完整回复
    aiMsg.content = fullContent;
    await dbPut(STORE_MSGS, aiMsg);

    // 添加操作按钮
    const actionsDiv = document.getElementById(`actions-${aiMsg.id}`);
    if (actionsDiv) {
      actionsDiv.innerHTML = `<button onclick="speakText(\`${escapeAttr(fullContent)}\`)" title="朗读">🔊</button>`;
    }

    // TTS 自动朗读
    if (fullContent) {
      speakText(fullContent);
    }

  } catch (err) {
    if (err.name === 'AbortError') {
      showToast('⏹️ 已停止生成');
    } else {
      showToast('❌ ' + err.message);
      const bubble = document.getElementById(`bubble-${aiMsg.id}`);
      if (bubble) bubble.textContent = '生成失败: ' + err.message;
      aiMsg.content = '[生成失败]';
      await dbPut(STORE_MSGS, aiMsg);
    }
  } finally {
    isStreaming = false;
    document.getElementById('sendBtn').disabled = false;
    abortController = null;
    renderMessages(); // 重新渲染以更新编辑按钮状态
  }
}

// ============================================================
// 语音识别 (ASR)
// ============================================================
function initRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast('⚠️ 当前浏览器不支持语音识别');
    return null;
  }

  const recog = new SpeechRecognition();
  recog.lang = 'ja-JP';
  recog.interimResults = true;
  recog.continuous = false;

  recog.onresult = (event) => {
    let finalTranscript = '';
    let interimTranscript = '';

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalTranscript += transcript;
      } else {
        interimTranscript += transcript;
      }
    }

    const input = document.getElementById('inputText');
    if (finalTranscript) {
      input.value += finalTranscript;
    } else if (interimTranscript) {
      // 显示临时结果（可选）
    }
    autoResize(input);
  };

  recog.onend = () => {
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
  };

  recog.onerror = (event) => {
    console.error('Speech recognition error:', event.error);
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
    if (event.error !== 'no-speech') {
      showToast('⚠️ 语音识别错误: ' + event.error);
    }
  };

  return recog;
}

function toggleRecording() {
  if (isStreaming) return;

  if (isRecording) {
    if (recognition) recognition.stop();
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
  } else {
    if (!recognition) {
      recognition = initRecognition();
      if (!recognition) return;
    }
    try {
      recognition.start();
      isRecording = true;
      document.getElementById('micBtn').classList.add('recording');
    } catch (e) {
      showToast('⚠️ 无法启动语音识别');
    }
  }
}

// ============================================================
// 语音合成 (TTS)
// ============================================================
function speakText(text) {
  if (!text) return;

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'ja-JP';

  // 尝试选择日语语音
  const voices = window.speechSynthesis.getVoices();
  const jaVoice = voices.find(v => v.lang.startsWith('ja'));
  if (jaVoice) {
    utterance.voice = jaVoice;
  }

  utterance.rate = 0.9;
  utterance.pitch = 1.0;

  window.speechSynthesis.speak(utterance);
}

// 预加载语音列表
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };
}

// ============================================================
// 工具函数
// ============================================================
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escapeAttr(str) {
  return str.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
}

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  if (isToday) {
    return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  }
  return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ============================================================
// 启动应用
// ============================================================
init().catch(err => {
  console.error('初始化失败:', err);
  showToast('❌ 初始化失败: ' + err.message);
});
</script>
